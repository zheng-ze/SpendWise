schema: spec-driven

# Mirrors openspec/project.md, which is the readable long form. Keep the two in sync.
context: |
  SpendWise is a Flutter rewrite of a finished SwiftUI app frozen at ../SpendWise-SwiftUI. The Swift
  code is the source of truth for behavior; its own CLAUDE.md is stale. The port is a translation,
  not a redesign: type names match Swift (LedgerState, Entry, MoneySource, TransactionCategory,
  LedgerChange, LedgerError), and deviations happen only where a spec's "KNOWN DEFECT" or "PORT FIX"
  section sanctions one. Inventing behavior the spec does not describe is a defect.

  Layout: packages/domain/ is pure Dart (models, LedgerState, accounting) and must never gain a
  Flutter dependency; its pubspec.yaml deliberately has no `flutter:` key, which is the whole purity
  mechanism. app/ is the Flutter app and depends on domain by path. docs/ holds the behavior specs:
  Flutter_Port_Tech_Doc.md is the master plan, docs/modules/*.md are the per-phase specs, and
  docs/reviews/ are completed adversarial passes whose corrections are already applied - do not
  re-litigate their findings.

  Where the specs live: openspec/specs/ holds the promoted contracts an archived change has already
  delivered - Phase 1 promoted ledger-state, ledger-mutations, ledger-lifecycle, ledger-plans and
  ledger-invariants. An open change's specs/ state its own contract as a delta and merge into
  openspec/specs/ on archive, with the change kept at openspec/changes/archive/<date>-<name>/. Both
  were derived from the longer and more precise module specs in docs/modules/. For Phase 1 that
  source is docs/modules/domain_models.md, whose section numbers the design and task files cite
  directly. When a spec and the module spec appear to disagree, the module spec wins and the spec is
  what to correct. docs/HANDOVER.md is historical only: it records why commits 1.1 and 1.2 were
  built as they were, and nothing about outstanding work - the plan for that is the open change's
  tasks.md. openspec/project.md is the readable long form of this context block; keep the two in sync.

  Domain rules:
  - Money is Decimal, never double. A double in packages/domain/lib/ is a defect.
  - IDs are lowercase uuid strings, normalized at every construction boundary via
    normalizedOrNewID / normalizedOptionalID in lib/src/ids.dart. The legacy SQLite database holds
    uppercase ids, so this is load-bearing, and it is safe only because uuids are hex.
  - Int-coded enums carry an explicit `code` field pinned to the Swift raw value, never enum.index.
    Persistence writes these codes. fromCode throws ArgumentError on an unknown code so corrupt rows
    surface as load errors.
  - Window filters are half-open [start, end) everywhere.
  - A domain date is UTC midnight of the calendar day it names, normalized at every construction
    boundary by startOfDayUtc in calendar_day.dart, which is day-preserving. Never .toUtc(): it
    preserves the instant, so a local midnight moves back a day for every user east of Greenwich and
    an entry silently lands in the previous month. add-domain-accounting's design.md carries the
    full ruling and what Phases 4 and 5 inherit from it.
  - Models are immutable with hand-written value ==/hashCode. Change payloads carry stored objects
    and the change-emission tests compare change lists by value, so a mutable model would let a
    mutator edit an already-emitted object and the test would pass regardless. equatable is
    deliberately not used.
  - Mutators keep the validate -> mutate -> return List<LedgerChange> contract.

  Scope: Recurring Plans land inside the ledger core. They were deferred until accounts and entries
  existed, not dropped, since purge and the dereference sweep are what the plan cascade hooks into.
  Those are now in place, so plans are group 8 of complete-domain-ledger-core, ahead of the
  invariants: clauses 7 and 8 (dangling plan reference, exhausted plan) are then written once against
  real plan data rather than added later as an amendment. Group 8 covers RecurringPlan /
  EntryTemplate / RecurrenceFrequency, OccurrenceID, the LedgerState.plans map, the plan mutators,
  resolvePlans, and the plan cascade in deleteAccount. With it LedgerChange reaches its full 9 cases
  (adding upsertPlan, deletePlan) and LedgerError its full 12 (adding unknownPlan, exhaustedPlan).
  Two places a straight translation would be wrong: month-end strides must clamp, since Dart's
  DateTime constructor overflows a short month, and every stride is measured from the anchor so the
  clamping never accumulates; and occurrence ids are UUIDv5, taken from the already-present uuid
  package, with the name string measured in seconds from 2001-01-01 UTC rather than the Unix epoch.
  The plan id enters that name in lowercase normalized form, whereas Swift's uuidString is uppercase,
  so the same plan and day yield a different occurrence id in each app. That is intentional: the
  frozen SwiftUI app is a behavioral reference, not a conformance target, and lowercase normalized ids
  are a project-wide rule, so matching Swift byte-for-byte would mean reintroducing an uppercase id at
  the very boundary that rule normalizes. Nothing cross-reads occurrence ids between the two apps.

  Archival freezes a plan; deletion removes it, and the two are deliberately different. deleteAccount
  hard-removes every plan naming the account or any of its pockets, since archiving an account is a
  whole-holder retirement. deletePocket and deleteCategory remove nothing: the plan stays, its
  occurrences fail validation while the row is inactive, and resolvePlans reports those failures
  instead of throwing, because archiving one pocket or category is routine tidying a user is expected
  to undo and dropping plans there would make restore silently lossy. Every path that DELETES a row
  outright rather than archiving it must take the plans naming that row with it: the dereference sweep
  and the purge row helpers. Invariant clause 14 encodes this, permitting a plan to name an archived
  row but never a referenceOnly or tombstoned one.

  Illegal states are unreachable, and invariants only catch what slips. _checked runs
  assertInvariants inside an assert(() {...}()), so every clause is debug-only: a release build pays
  nothing and catches nothing, and the invariants are a backstop against a future mutator's mistake
  rather than the primary defense. Two mechanisms carry that weight. The maps are closed:
  _moneySources, _entries, _categories and _plans are private and the getters return
  UnmodifiableMapView, because every illegal state the audits demonstrated - a pocket claimed by two
  accounts, an orphan active pocket, order-dependent _owningAccount - required a direct map write.
  And there is one row remover per row kind: _detachAndTombstonePocket is the sole remover of a
  pocket row and kills the row and the parent link together, so a dangling link has no window to
  exist in. Inverting the pocket-parent link was considered and rejected; it contradicts the
  translation rule on the structure the domain is keyed to and would drop the UpsertAccount that
  addPocket emits. Reject rather than silently coerce: addPocket throws InactiveReference on a
  non-active parent instead of demoting the pocket, and a category's kind is fixed at creation, with
  updateCategory throwing CategoryKindMismatch. A check that must survive into release, such as a
  corrupt store on load, needs a real conditional throw and a user-visible error, not an assert.

  Comment style is minimal: comment only tricky nuance, deliberate spec deviations, or ordering
  constraints a reader would otherwise break, and never restate what the code says. No reference to
  the Swift project in code comments, no spec or doc citations in source (section numbers belong in
  the change's design and tasks files), and no em dashes, semicolons or colon splices in comment
  prose. The same budget applies to tests, where the test name carries the intent.

  Keep each file's scope small and single-purpose: LedgerState is split by concern into
  ledger_state_holders, _categories, _entries, _plans, _purge, _queries and _invariants as part files
  of one class. Pull repeated bodies into a named helper. Split by concern, not by symbol count - a
  file holding only a couple of date helpers was judged too small and folded into plan_scheduling.

  Checks: `cd packages/domain && dart format . && dart analyze && dart test` and
  `cd app && flutter analyze`. The analyzer must be at zero issues, not just zero errors.
  Toolchain: Flutter 3.44.9 / Dart 3.12.2.

  Working style: the user commits themselves, so never run git commit - report when something is
  green and let them take it. Commit messages are Conventional Commits, succinct, and never mention
  adversarial reviews or subagents. They push back on unnecessary abstraction, so build the smaller
  thing and let them ask for more, and verify claims against the code before asserting them.

  Most implementation runs through subagents, one task group at a time, parallel only across disjoint
  files. A subagent without Bash cannot run dart analyze or dart test, so its report is a claim and
  not a result: grant Bash to any agent that writes code, or run the gate in the main thread. Audit
  findings are unverified until checked at the cited file:line - one reported as CRITICAL behavior
  the spec explicitly requires, and three dependent findings fell with it. Running two agents from
  different angles surfaces the disagreement. A subagent may cite a user instruction absent from the
  main transcript and still be right, since the user intervenes in running subagents directly; judge
  the instruction against the spec and the code. When a subagent stalls, is killed or lands the
  wrong thing, retry with a brand-new agent briefed from the task and the code rather than from the
  failed attempt, since the prior framing is what produced the wrong result. Verify the tree is
  clean first, and state which behavior is new in the change and which predates it, or the agent
  will re-derive existing behavior as a defect.

  tasks.md in the open change is both queue and record, and only the main thread edits it. A
  subagent reports what it landed; the main thread verifies at the cited file:line and ticks. Tick
  items as they land, renumber or append when inserting new work rather than leaving duplicate
  numbers, and confirm a group's dependencies are really complete before starting it. Task text is
  plain language, never the jargon of whatever review technique found the item: a task says the
  tests did not catch the bug, never that a mutant survived or a rule is unpinned. Give each task
  what to test, where the bug goes, what breaks for the user, why the current tests miss it, and
  what to add - that fourth clause is what stops a reader assuming the case is already covered.
  Tallies read caught, missed and no real change in behavior. At a phase
  boundary, run adversarial reviews from several angles, consolidate the findings into tasks.md as
  numbered tasks, and fix from there.

  Write the tests first, then the implementation. Run each new test against the unfixed code and
  watch it go red before writing the fix, since that red is the proof it bites and removes any need
  to mutate and revert afterward. Then land the fix and watch it go green. A test already green
  before the fix is pinning something other than the defect. A scenario an audit probe ran belongs
  in the committed suite. Assert the whole change list, and assert that a throwing path left state
  untouched.

