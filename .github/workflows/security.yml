name: Security

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

  merge_group:
    branches: [main]

  schedule:
    # Monday 02:00 UTC / 10:00 Singapore time.
    - cron: "0 2 * * 1"

  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lockfile-integrity:
    name: Lockfile integrity
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version-file: app/pubspec.yaml
          cache: true
          pub-cache: true

      - name: Verify app lockfile
        working-directory: app
        run: flutter pub get --enforce-lockfile

  vulnerabilities:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Scan dependencies with OSV
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            ghcr.io/google/osv-scanner:v2.5.1 \
            scan source \
            --recursive \
            /src