name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
        working-directory: packages/domain
      - run: dart format --output=none --set-exit-if-changed .
        working-directory: packages/domain
      - run: dart analyze
        working-directory: packages/domain
      - run: dart test
        working-directory: packages/domain

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
      - run: flutter pub get
        working-directory: packages/ocr
      - run: flutter test
        working-directory: packages/ocr
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app
